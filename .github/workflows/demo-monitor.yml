name: Monitor demo

# Co 6 h sprawdza publiczne demo (rcp.log.twapp.pl) tak, jak widzi je rekruter. Bramka gości
# (GATED_ENDPOINTS: /, /admin, /admin/login) bez sesji przekierowuje na /wejscie, więc monitor
# sprawdza właśnie /wejscie (tytuł „RCP Log — Demo”), a / i /admin/login tylko po statusie 200
# po przekierowaniach (bez sprawdzania treści).
# Za bramką portfolio (ForwardAuth, od 24.10) każda z tych stron daje 401 z formularzem
# portfolio.twapp.pl/wejscie — to też wynik poprawny (wtedy bez sprawdzania treści).
# Aplikacja nie ma osobnego /health — healthcheck obrazu też sprawdza `/` (Dockerfile).
# Awaria → issue „Demo nie odpowiada” z etykietą `demo` (jedno, kolejne awarie jako komentarze);
# powrót do normy → issue zamknięte.
on:
  schedule:
    - cron: '17 */6 * * *'   # co 6 h, poza pełną godziną (mniej opóźnień w GitHub)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: demo-monitor
  cancel-in-progress: false

env:
  DEMO_URL: https://rcp.log.twapp.pl
  LABEL: demo

jobs:
  check:
    name: Demo dla rekrutera
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Sprawdź demo
        id: check
        shell: bash
        run: |
          set -uo pipefail
          problems=()
          # status HTTP po przekierowaniach + treść strony; ponowienia na błędach sieci i 5xx
          # Od 24.10 demo stoi za ForwardAuth portfolio: bez ciasteczka `gosc` strony dają 401
          # z formularzem bramki (link do portfolio.twapp.pl/wejscie) — to znaczy, że bramka działa;
          # treści aplikacji wtedy nie widać, więc jej nie sprawdzamy.
          za_bramka=''
          check() {
            local path="$1" expect="${2:-}" code
            rm -f page.html   # curl nie tworzy pliku przy pustej treści — bez starej strony
            code=$(curl -sS -L -o page.html -w '%{http_code}' --max-time 30 \
              --retry 3 --retry-delay 20 --retry-all-errors "$DEMO_URL$path") || code="${code:-000}"
            if [ "$code" = 401 ] && grep -qF 'portfolio.twapp.pl/wejscie' page.html 2>/dev/null; then
              za_bramka=1
            elif [ "$code" != 200 ]; then
              problems+=("$path → HTTP $code (oczekiwane 200 albo 401 z bramką portfolio)")
            elif [ -n "$expect" ] && ! grep -q "$expect" page.html; then
              problems+=("$path → 200, ale brak „$expect” w treści")
            fi
          }
          check /wejscie 'RCP Log — Demo'
          check /
          check /admin/login
          # Aplikacja nie ma endpointu zdrowia (przepuszczanego przez ForwardAuth), więc za bramką
          # monitor widzi tylko bramkę portfolio — nie potwierdza, że sama aplikacja żyje.
          note=''
          [ -n "$za_bramka" ] && note=' Za bramką portfolio – aplikacja nie ma endpointu zdrowia, sprawdzono tylko bramkę.'

          if [ ${#problems[@]} -eq 0 ]; then
            echo "Demo działa ($DEMO_URL).$note" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            {
              echo "Demo $DEMO_URL — problemy ($(date -u '+%Y-%m-%d %H:%M UTC')):"
              for p in "${problems[@]}"; do echo "- $p"; done
              [ -z "$note" ] || echo "-$note"
              echo
              echo "Przebieg: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            } > report.md
            tee -a "$GITHUB_STEP_SUMMARY" < report.md
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Zgłoś awarię (issue)
        if: steps.check.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          # push ntfy (opcjonalny: bez sekretu NTFY_URL pomijamy; nigdy nie psuje przebiegu)
          ntfy() {
            case "${NTFY_URL:-}" in https://*) ;; *) echo "NTFY_URL nie ustawiony lub nie https — pomijam push"; return 0;; esac
            curl -fsS --max-time 10 -H "Title: $1" -H "Priority: $2" -H "Tags: $3" -d "$4" "$NTFY_URL" || true
          }
          gh label create "$LABEL" --color B60205 --description "Automatyczny monitor demo" 2>/dev/null || true
          open=$(gh issue list --label "$LABEL" --state open --search 'in:title "Demo nie odpowiada"' \
            --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file report.md
          else
            gh issue create --title "Demo nie odpowiada" --label "$LABEL" --body-file report.md
            ntfy "Demo nie odpowiada: rcp-log-public" high warning "Demo przestało odpowiadać. Szczegóły: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          exit 1   # czerwony przebieg = mail z GitHub do właściciela repozytorium

      - name: Zamknij zgłoszenie po naprawie
        if: steps.check.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NTFY_URL: ${{ secrets.NTFY_URL }}
        run: |
          # push ntfy (opcjonalny: bez sekretu NTFY_URL pomijamy; nigdy nie psuje przebiegu)
          ntfy() {
            case "${NTFY_URL:-}" in https://*) ;; *) echo "NTFY_URL nie ustawiony lub nie https — pomijam push"; return 0;; esac
            curl -fsS --max-time 10 -H "Title: $1" -H "Priority: $2" -H "Tags: $3" -d "$4" "$NTFY_URL" || true
          }
          for n in $(gh issue list --label "$LABEL" --state open --search 'in:title "Demo nie odpowiada"' \
              --json number --jq '.[].number'); do
            gh issue close "$n" --comment "Demo znów działa ($(date -u '+%Y-%m-%d %H:%M UTC'))."
            recovered=1
          done
          if [ -n "${recovered:-}" ]; then
            ntfy "Demo znowu odpowiada: rcp-log-public" low white_check_mark "Demo znowu odpowiada. Przebieg: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
